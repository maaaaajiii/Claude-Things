name: Macro Dashboard

# MINIMAL BY DESIGN, for now.
#
# Two earlier attempts produced no bot commit and no readable failure, and the run
# logs are not visible from where this was authored, so this version is stripped to
# the smallest thing that can possibly work: fetch, build, commit. The web-research
# stage and the Pages deploy are removed rather than merely disabled, and go back in
# one at a time once this is green. Git history has the full version.
#
# It also reports itself: every step writes to the job summary, so the outcome is
# readable on the run page without opening a single log group.
#
# Times are UTC. 14:30 UTC = 21:30 WIB, an hour after the 08:30 ET releases (CPI,
# PCE, NFP). 00:00 UTC = 07:00 WIB, the safety net for whatever the earlier run was
# too early to see.
on:
  schedule:
    - cron: "30 14 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# A newer run always wins. The opposite setting let a hung run block everything
# queued behind it, which from outside is indistinguishable from nothing happening.
concurrency:
  group: macro-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # FRED and CoinGecko sit behind CDNs that sometimes refuse datacenter IPs, and
      # GitHub runners are datacenter IPs. If that is the problem, this says so in one
      # line rather than leaving a confusing failure further down.
      - name: Check the data sources are reachable from this runner
        run: |
          {
            echo "## Connectivity"
            echo ""
            echo "| Source | HTTP |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for name in FRED CoinGecko; do
            case $name in
              FRED) url="https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS10&cosd=2026-08-01" ;;
              CoinGecko) url="https://api.coingecko.com/api/v3/global" ;;
            esac
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo "000")
            echo "| $name | $code |" >> "$GITHUB_STEP_SUMMARY"
            echo "$name -> $code"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: Build dashboard
        working-directory: macro-dashboard
        run: |
          set -o pipefail
          python build_macro_dashboard.py --verbose 2>&1 | tee build.log
          {
            echo "## Build"
            echo ""
            echo '```'
            tail -n 6 build.log
            echo '```'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f build.log

      # Stage the folder rather than naming paths: "git add a b c" fails ATOMICALLY
      # when any one pathspec matches nothing, staging none of them. Naming a file
      # that does not exist yet is how the first version silently committed nothing
      # on every run while still reporting success.
      - name: Commit the rebuilt dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A macro-dashboard

          {
            echo "## Commit"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if git diff --staged --quiet; then
            echo "Nothing changed."
            echo "Nothing to commit: no file differed from the previous run." >> "$GITHUB_STEP_SUMMARY"
          else
            git diff --staged --name-only | sed 's/^/  /'
            git commit -q -m "macro: rebuild dashboard $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}"
            git push -q origin "HEAD:${GITHUB_REF_NAME}"
            {
              echo "Pushed \`$(git rev-parse --short HEAD)\`:"
              echo ""
              echo '```'
              git show --stat --oneline HEAD | tail -n +2
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
