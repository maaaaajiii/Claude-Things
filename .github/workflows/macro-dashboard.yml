name: Macro Dashboard

# Rebuilds dashboard.html from FRED + CoinGecko on a schedule, so it stays current
# without any local machine needing to be on.
#
# Times are UTC. 14:30 UTC = 21:30 WIB, which is one hour after the 08:30 ET releases
# (CPI, PCE, NFP) land. 00:00 UTC = 07:00 WIB, which picks up the previous US session
# once FRED has posted it, and acts as the safety net for anything the earlier run was
# too early to catch.
on:
  schedule:
    - cron: "30 14 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# Needed so the job can commit the rebuilt dashboard and the new snapshot back.
permissions:
  contents: write
  pages: write
  id-token: write

# If a run is already in progress, let it finish rather than racing it: two jobs
# pushing to the same branch is exactly how you get a rejected push.
concurrency:
  group: macro-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      # The builder is pure Python standard library on purpose: no pandas, no
      # requests, nothing to install, nothing to pin, nothing to break on upgrade.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # STAGE 1 - refresh the half that cannot be fetched programmatically: the
      # economic calendar, Fed decision odds, crypto positioning, the BI rate. That
      # needs a browsing agent, so it runs through the Claude action.
      #
      # continue-on-error is deliberate and is the whole point of the design. A
      # failure here must never block the build below: the automated FRED data stays
      # fresh regardless, and the manual data simply keeps its old values and labels
      # itself stale on the page. Losing the refresh is an inconvenience. Losing the
      # entire dashboard because the refresh had a bad day is not.
      - name: Refresh manual data (web research)
        if: env.HAS_CLAUDE_TOKEN == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read macro-dashboard/macro-refresh-prompt.md and follow it exactly.
            Work only inside the macro-dashboard/ folder. Do not commit or push;
            a later step in this same workflow does that.
          claude_args: '--allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep"'

      - name: Build dashboard
        working-directory: macro-dashboard
        run: python build_macro_dashboard.py --verbose

      # The "what changed since last refresh" panel works by diffing this run's
      # snapshot against the previous one, so the snapshots MUST be committed back.
      # Without this the cloud would think every run was its first and the panel
      # would never populate.
      - name: Commit updated dashboard and snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage the whole folder rather than naming paths. "git add a b c" fails
          # ATOMICALLY when any one pathspec matches nothing, staging none of them, and
          # macro-refresh-status.json only exists after the refresh stage has run. The
          # first version therefore staged nothing, swallowed the error via "|| true",
          # and reported "Nothing changed" on every run while the build itself was green.
          git add -A macro-dashboard
          if git diff --staged --quiet; then
            echo "Nothing changed, nothing to commit."
          else
            git commit -m "macro: rebuild dashboard $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Rebase before pushing: a manual push or the other daily run may have
            # landed while this job was fetching 39 series.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Optional. Publishing needs Pages enabled on the repo, which on a PRIVATE repo
      # requires a paid GitHub plan. Set a repository variable ENABLE_PAGES=true to
      # turn this on; leave it unset and the whole block is skipped harmlessly.
      - name: Prepare Pages artifact
        if: vars.ENABLE_PAGES == 'true'
        run: |
          mkdir -p _site
          cp macro-dashboard/dashboard.html _site/index.html

      - uses: actions/upload-pages-artifact@v4
        if: vars.ENABLE_PAGES == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
